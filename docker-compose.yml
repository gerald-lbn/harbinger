services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: harbinger_backend
    ports:
      - '3333:3333'
    environment:
      - NODE_ENV=production
      - PORT=3333
      - HOST=0.0.0.0
      - LOG_LEVEL=info
      - APP_KEY=3ba2d26c717073f5f08ea67ac262b53a50a7ecad6aaba6a5e42155f67c1a0fd1
      - APP_URL=http://localhost:3333
      - SESSION_DRIVER=cookie
      - QUEUE_DRIVER=database
      - CRON_FEED_CRAWLER=*/10 * * * *
      - DATABASE_AUTOMIGRATE=true
    volumes:
      - backend-data:/app/tmp
    restart: unless-stopped

volumes:
  backend-data:
